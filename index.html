<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swoof — Photo Library Triage</title>
    <meta name="description" content="Swoof helps you sort your iPhone photo library with a swipe. Legal documents and support.">
    <link rel="canonical" href="https://galkin1928.github.io/swoof/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #F2EAE2;
            background: linear-gradient(135deg, #1A1816 0%, #2A2420 60%, #3A4A38 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #1F1C19;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(139, 184, 138, 0.15);
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #F2EAE2;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: #8BB88A;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .link-button {
            display: block;
            padding: 18px 30px;
            background: linear-gradient(135deg, #8BB88A 0%, #6FA06E 100%);
            color: #141210;
            text-decoration: none;
            border-radius: 14px;
            font-size: 1.05em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 184, 138, 0.35);
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(242, 234, 226, 0.12);
            color: rgba(242, 234, 226, 0.55);
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">📸</div>
        <h1>Swoof</h1>
        <p class="tagline">Swipe-powered photo library triage</p>

        <div class="links">
            <a href="terms.html" class="link-button">Terms of Use</a>
            <a href="privacy.html" class="link-button">Privacy Policy</a>
            <a href="support.html" class="link-button">Support</a>
            <a href="testflight-internal-testing.html" class="link-button">TestFlight Instructions</a>
        </div>

        <div class="footer">
            <p>&copy; 2026 Swoof</p>
            <p style="margin-top: 10px;">All rights reserved</p>
        </div>
    </div>
</body>

</html>
